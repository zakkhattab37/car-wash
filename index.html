<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#F4F7F8">
  <title>لوحة التحكم | البشمهندس</title>
  <link rel="icon" href="assets/mark.svg" type="image/svg+xml">
  <link href="css/fonts.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/tailwind.css">
  <link rel="stylesheet" href="css/icons.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/animations.css">
</head>
<body>
  <aside id="sidebar" aria-label="القائمة الرئيسية"></aside>
  <div id="sidebar-handle" role="separator" tabindex="0" aria-orientation="vertical"
    aria-controls="sidebar" aria-label="اسحب لتغيير عرض القائمة الجانبية أو فتحها وإغلاقها"
    aria-valuemin="0" aria-valuenow="0"></div>
  <button id="backdrop" aria-label="إغلاق القائمة" hidden></button>
  <div class="shell">
    <header id="topbar"></header>
    <main id="content" tabindex="-1" aria-busy="true">
      <div class="skeleton sk-heading"></div>
      <div class="metrics grid"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>
      <div class="skeleton sk-panel"></div>
    </main>
    <footer class="app-footer"><span>البشمهندس لإدارة مغاسل السيارات</span><a href="https://www.flaticon.com/uicons">أيقونات Flaticon من Freepik</a></footer>
  </div>
  <dialog id="modal"></dialog>
  <div id="toasts" aria-live="polite"></div>
  <section id="print-area" aria-label="المستند المطبوع"></section>
  <script type="module" src="js/app.js"></script>
</body>
</html>
